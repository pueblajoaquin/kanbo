<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kanbo — Project</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <section class="hero-card">
      <div>
        <p class="eyebrow">Project board</p>
        <h1 id="project-name">Loading...</h1>
        <p id="task-summary" class="hero-copy">Loading your tasks and progress.</p>
      </div>
      <div class="hero-actions">
        <div class="metric">
          <span class="metric-label">Tasks</span>
          <strong id="task-count">0 tasks</strong>
        </div>
        <div class="metric">
          <span class="metric-label">Done</span>
          <strong id="done-count">0 done</strong>
        </div>
        <button id="logout-btn" class="secondary-btn">Log out</button>
      </div>
    </section>

    <a href="projects.html" class="back-link">&larr; Back to projects</a>

    <section class="panel">
      <form id="new-task-form" class="inline-form">
        <input type="text" id="task-title" placeholder="New task title" required>
        <button type="submit">Add task</button>
      </form>

      <p id="error-message" class="error" aria-live="polite"></p>

      <ul id="task-list" class="stack-list"></ul>
    </section>

    <section class="panel">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Members</p>
          <h2 class="section-title">Project access</h2>
        </div>
        <div class="metric metric-inline">
          <span class="metric-label">Members</span>
          <strong id="member-count">0 members</strong>
        </div>
      </div>

      <p id="member-summary" class="hero-copy">Invite teammates and keep track of who owns the project.</p>

      <form id="invite-member-form" class="inline-form">
        <input type="email" id="member-email" placeholder="Teammate email" required>
        <button type="submit">Invite member</button>
      </form>

      <p id="member-message" class="error" aria-live="polite"></p>

      <ul id="member-list" class="stack-list"></ul>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/project.js"></script>
</body>
</html>

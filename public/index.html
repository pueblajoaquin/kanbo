<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kanbo — Log in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-hero">
      <p class="eyebrow">Kanbo</p>
      <h1>Focus on the work, not the wiring.</h1>
      <p class="hero-copy">Track projects and tasks with a cleaner board, faster flow, and a more readable workspace.</p>
    </section>
    <section class="container card">
      <h1 class="card-title">Log in</h1>
      <form id="login-form">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Log in</button>
      </form>
      <p id="error-message" class="error"></p>
      <p>No account yet? <a href="register.html">Register</a></p>
    </section>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
